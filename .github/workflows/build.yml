name: Build Plugin

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.ReleaseMediaFilter
  PLUGIN_VERSION: 1.0.0.${{ github.run_number }}
  DOTNET_VERSION: 8.0.x
  LIDARR_VERSION: 3.1.3.4987

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Lidarr source
        run: |
          if [ ! -f ext/Lidarr/src/NzbDrone.Core/Lidarr.Core.csproj ]; then
            git clone --branch develop --depth 1 https://github.com/Lidarr/Lidarr.git ext/Lidarr
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pin Lidarr assembly version
        run: |
          props=ext/Lidarr/src/Directory.Build.props
          if [ -f "$props" ]; then
            sed -i -E "s#<AssemblyVersion>[0-9.*]+</AssemblyVersion>#<AssemblyVersion>${LIDARR_VERSION}</AssemblyVersion>#" "$props" || true
          fi

      - name: Build
        run: |
          dotnet restore ReleaseMediaFilter.sln /p:WarningsNotAsErrors="NU1902"
          dotnet build ReleaseMediaFilter.sln -c Release --no-incremental /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=false /p:WarningsNotAsErrors="NU1902"

      - name: Test
        run: |
          dotnet test tests/ReleaseMediaFilter.Test/ReleaseMediaFilter.Test.csproj -c Release --no-build --verbosity normal /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=false

      - name: Zip Plugin
        if: github.ref == 'refs/heads/master'
        run: |
          cd _temp/bin/Release/ReleaseMediaFilter
          zip /tmp/${{ env.PLUGIN_NAME }}.net8.0.zip Lidarr.Plugin.ReleaseMediaFilter.dll Lidarr.Plugin.ReleaseMediaFilter.pdb

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_VERSION }}
          draft: true
          files: /tmp/${{ env.PLUGIN_NAME }}.net8.0.zip
